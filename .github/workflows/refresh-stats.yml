name: Refresh stats

on:
  schedule:
    - cron: "0 */3 * * *"
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      season:
        description: Season to refresh. Blank means the latest row in seasons.
        required: false
        type: string
      refit:
        description: Refit the season's parameters first, if its params_refit_until is still in the future.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: refresh-stats
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  WEEKLY_REFIT_CRON: "0 12 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Check secrets
        run: |
          for name in SUPABASE_URL SUPABASE_SECRET_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret $name is not set"
              exit 1
            fi
          done

      - name: Resolve season
        env:
          SEASON_INPUT: ${{ inputs.season }}
        run: |
          season="$SEASON_INPUT"
          if [ -z "$season" ]; then
            season=$(curl -fsS "$SUPABASE_URL/rest/v1/seasons?select=season&order=season.desc&limit=1" \
              -H "apikey: $SUPABASE_SECRET_KEY" | jq -er '.[0].season')
          fi
          case "$season" in
            ''|*[!0-9]*) echo "::error::season must be a number, got '$season'"; exit 1 ;;
          esac
          echo "SEASON=$season" >> "$GITHUB_ENV"

      - name: Refit parameters
        if: github.event.schedule == env.WEEKLY_REFIT_CRON || inputs.refit
        run: python pipeline/fit_params.py --season "$SEASON" --write --if-open --min-new-matches 100

      - name: Refresh ratings
        run: python pipeline/refresh.py run --season "$SEASON"
